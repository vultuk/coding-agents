interface:
  display_name: "ExecPlan"
  short_description: "Manage living ExecPlans in GitHub issue comments"
  default_prompt: "Use $execplan to turn GitHub issue #123 into a living ExecPlan comment and keep it updated while implementing the work. The GitHub thread is the audit log. Keep the managed marker `<!-- execplan:managed -->`, maintain the hidden metadata block between `<!-- execplan:meta:start -->` and `<!-- execplan:meta:end -->`, and keep the required sections current, including `Audit Evidence` and `Delivery Metadata`. Every `Progress` item must use a stable slice ID such as `EP-001`, and every completed slice must add one matching audit evidence entry with `slice`, `time`, `kind`, `action`, `cwd`, `result`, and `proof`. Before each comment edit, re-fetch the latest remote body and `updated_at`; if the remote changed, rebuild the edit against the fresh body and retry once, then stop and record a blocker instead of overwriting a second conflicting edit. Before any commit is created, run the `review-changes` skill on the local diff, fix every `Must fix (blocking)` and `Should fix (important)` finding that can be resolved safely, and re-run review if those fixes change the diff. When implementation is done, do not stop at local changes: only after that review gate is satisfied should you commit the work, push the branch, create the pull request, request PR review from the original issue author, and create or update the final issue handoff comment marked with `<!-- execplan:handoff -->` so it tags that author when possible, includes the PR link, branch, commit, and concrete validation status, and does not create duplicates on retries."
