interface:
  display_name: "ExecPlan"
  short_description: "Manage living ExecPlans in GitHub issue comments"
  default_prompt: "Use $execplan to turn GitHub issue #123 into a living ExecPlan comment and keep it updated while implementing the work, checking off the matching `Progress` item in the managed comment immediately after each completed slice and verifying the remote comment reflects that change before continuing. Before any commit is created, run the `review-changes` skill on the local diff, fix every `Must fix (blocking)` and `Should fix (important)` finding that can be resolved safely, and re-run review if those fixes change the diff. When implementation is done, do not stop at local changes: only after that review gate is satisfied should you commit the work, push the branch, create the pull request, request PR review from the original issue author, and create or update the final issue handoff comment so it tags that author when possible, includes the PR link, branch, commit, and concrete validation status, and does not create duplicates on retries."
