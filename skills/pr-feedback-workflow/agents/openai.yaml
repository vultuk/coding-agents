interface:
  display_name: "PR Feedback Workflow"
  short_description: "Resumable PR feedback monitor with persisted state and watch mode"
  default_prompt: "Use $pr-feedback-workflow to completely deal with this PR. Set a Codex goal when the goal function is available, resolve the PR context, reuse the existing state file if present, run the helper script with --complete-when-clean as the canonical polling engine, handle each surfaced item, persist handled or blocked state updates, and then re-enter watch mode until all review feedback is handled and CI/CD has no failures or pending checks, I stop you, or the PR closes."
